name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      cmake_args: -DENUM_REFLECTION_BUILD_BENCH=ON -DENUM_REFLECTION_MUTANTS=ON  # builds the benchmark, which no test runs; compiles the name test once per mutant
      freebsd_packages: python3
